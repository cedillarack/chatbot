<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>chatbot</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="chat">
    <header class="chat-header">
      <div class="avatar">c</div>
      <div>
        <h1>chatbot</h1>
        <p>Ask anything about Nishitha Degree College</p>
      </div>
    </header>

    <div id="messages" class="messages">
      <div class="message assistant">
        <div class="bubble">Hi! I'm chatbot. Ask me anything about Nishitha Degree College.</div>
      </div>
    </div>

    <form id="chat-form" class="chat-form">
      <input id="chat-input" type="text" placeholder="Type your message..." autocomplete="off" required>
      <button type="submit" id="send-btn">Send</button>
    </form>
  </main>

  <script src="/app.js"></script>
</body>
</html>
