<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f1117">
  <title>Chatbot</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="chat">
    <header class="chat-header">
      <div class="avatar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 8V4H8"/>
          <rect x="4" y="8" width="16" height="12" rx="2"/>
          <path d="M2 14h2M20 14h2M15 13v2M9 13v2"/>
        </svg>
      </div>
      <div class="chat-header-text">
        <h1>Chatbot</h1>
        <p>Ask anything about Nishitha Degree College</p>
      </div>
      <div class="header-actions">
        <button id="info-btn" class="icon-btn" type="button" aria-label="About Chatbot" title="About">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 16v-4M12 8h.01"/>
          </svg>
        </button>
        <button id="theme-btn" class="icon-btn" type="button" aria-label="Switch theme" title="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
    </header>

    <div id="messages" class="messages">
      <div class="message assistant">
        <div class="bubble">Hi! I'm Chatbot. Ask me anything about Nishitha Degree College.</div>
      </div>
    </div>

    <form id="chat-form" class="chat-form">
      <input id="chat-input" type="text" placeholder="Type your message..." autocomplete="off" required>
      <button type="submit" id="send-btn" aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/>
        </svg>
      </button>
    </form>
  </main>

  <dialog id="info-dialog" class="info-dialog">
    <div class="info-dialog-inner">
      <h2>Chatbot</h2>
      <p>Chatbot is a project presented by <strong>Vaishnavi</strong>, <strong>Sri Gowrika</strong>, <strong>Rajasri</strong> and <strong>Shivaraj</strong>.</p>
      <p class="info-note">It answers questions about Nishitha Degree College using its knowledge base.</p>
      <button id="info-close" class="close-btn" type="button">Close</button>
    </div>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
